<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falling Words</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .falling-word {
      position: absolute;
      font-size: 1.3rem;
      font-weight: bold;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 8px;
      padding: 2px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      pointer-events: none;
      user-select: none;
      transition: background 0.2s;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: -230px;
      width: 240px;
      height: 100%;
      background-color: #f9fafb;
      box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      transition: right 0.3s ease-in-out;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .drawer.open {
      right: 0;
    }
    .drawer-toggle {
      position: absolute;
      top: 50%;
      right: 100%;
      transform: translateY(-50%);
      z-index: 1001;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 1rem 0.5rem;
      border-radius: 8px 0 0 8px;
      font-weight: bold;
      border-right-width: 0;
    }
    .drawer-toggle::before {
      content: '\25c0';
      display: inline-block;
      margin-bottom: 0.5em;
    }
    .drawer.open .drawer-toggle::before {
      content: '\25b6';
    }
    .drawer-content .icon {
      width: 100%;
      justify-content: flex-start;
    }
    .drawer-content {
      padding: 1rem;
      flex-grow: 1;
      overflow-y: auto;
    }
    .drawer-footer {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }
    @media print {
      .drawer, .toolbar {
        display: none;
      }
    }
    /* play area header moved inside playfield to save space */
    .playfield-header {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
      align-items: flex-start;
      background: rgba(255,255,255,0.92);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      max-width: 220px;
      min-width: 120px;
      pointer-events: auto;
    }
    .type-display { display:none; }
    .virtual-keyboard {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      width: 100%;
      box-sizing: border-box;
      max-width: 720px;
      overflow: hidden;
    }
    .vk-row { display:flex; gap:4px; justify-content:space-between; flex-wrap:wrap; }
    .vk-row .key { flex: 1 1 0; }
    .key {
      background: #f3f4f6;
      border-radius: 6px;
      padding: 6px 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(0,0,0,0.06);
      font-weight: 600;
      min-width: 26px;
      box-sizing: border-box;
      line-height: 1;
      font-size: 0.95rem;
    }
    .key.key-urgent { background: #fde68a; box-shadow: 0 0 0 3px rgba(253,230,138,0.18); }
    /* falling word letter highlights */
    .falling-word .fw-letter { display:inline-block; padding:0 2px; }
    .falling-word.fw-active { background: rgba(99,102,241,0.06); border-radius:6px; padding:2px 6px; }
    .falling-word .fw-current { background:#fde68a; border-radius:4px; padding:0 2px; }
    /* layout responsiveness */
    .game-column { display:flex; flex-direction:column; gap:8px; }
    @media (min-width: 720px) {
      .virtual-keyboard { max-width: 520px; margin:10px auto 0 auto; }
    }
  </style>
</head>
<body>
<!-- Drawer markup moved to top of body for visibility -->
<div id="settingsDrawer" class="drawer">
  <button id="drawerToggleBtn" class="icon drawer-toggle">Menu</button>
  <div class="drawer-content">
    <h3>Game Options</h3>
    <div style="margin-bottom:18px;">
      <label style="display:flex;align-items:center;gap:8px;font-weight:bold;">Fall Speed:
        <input type="range" id="fallSpeedSlider" min="1" max="10" value="1" style="flex:1;">
        <span id="fallSpeedValue" style="min-width:36px;text-align:center;font-weight:normal;">1</span>
      </label>
    </div>
    <div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:bold;">Word Density:
        <input type="range" id="wordDensitySlider" min="1" max="10" value="2" style="flex:1;">
        <span id="wordDensityValue" style="min-width:36px;text-align:center;font-weight:normal;">2</span>
      </label>
    </div>
    <div style="margin-top:12px;">
      <button id="resetDefaultsBtn" class="icon" style="width:100%;">Reset to defaults</button>
    </div>
  </div>
  <div class="drawer-footer"><a href="../index.html"><button class="icon" style="width: 100%; justify-content: flex-start;">🏠 Home</button></a></div>
</div>
  <div class="container" style="display: flex; flex-direction: row; gap: 32px; align-items: flex-start;">
  <div style="flex: 1 1 auto; min-width: 0;">
    <div style="position:relative;">
      <div id="playfield">
        <div id="playfieldHeader" class="playfield-header" aria-hidden="false">
          <div class="badge">Lives: <span id="lives">3</span></div>
          <div class="badge">Score: <span id="score">0</span></div>
          <div class="badge">Speed: <span id="speed">1x</span></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
            <button id="pauseBtn" class="icon">⏸️ Pause</button>
          </div>
        </div>
      </div>
      <div id="startOverlay" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.08);z-index:2;">
        <div class="card"><div class="card-body"><h2>Press any key, mouse, or touch to begin</h2></div></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px"><div class="card-body">
        <div class="game-column">
        <div style="min-height:32px"></div>
        <div class="virtual-keyboard" id="virtualKeyboard" aria-hidden="false">
        <div class="vk-row" id="vkRow1">
          <div class="key">Q</div><div class="key">W</div><div class="key">E</div><div class="key">R</div><div class="key">T</div><div class="key">Y</div><div class="key">U</div><div class="key">I</div><div class="key">O</div><div class="key">P</div>
        </div>
        <div class="vk-row" id="vkRow2">
          <div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div><div class="key">G</div><div class="key">H</div><div class="key">J</div><div class="key">K</div><div class="key">L</div>
        </div>
        <div class="vk-row" id="vkRow3">
          <div class="key">Z</div><div class="key">X</div><div class="key">C</div><div class="key">V</div><div class="key">B</div><div class="key">N</div><div class="key">M</div>
        </div>
        <!-- Bottom control row removed to save space (no backspace/space/enter) -->
        </div>
        <div class="small">Type the highlighted letter. Correct letters advance to the next. Words are removed when complete.</div>
      </div>
    </div></div>
  </div>
  <!-- Drawer is now only outside the container -->
</div>
<script type="module">
  // Drawer logic
  const drawerToggleBtn = document.getElementById("drawerToggleBtn");
  const settingsDrawer = document.getElementById("settingsDrawer");
  if (drawerToggleBtn && settingsDrawer) {
    drawerToggleBtn.addEventListener('click', () => {
      settingsDrawer.classList.toggle('open');
    });
  }
  import { loadConfig, normalizeWord } from "./app.js";

  const cfg = loadConfig();
  if (!cfg) {
    document.body.innerHTML = '<div class="container"><h1>Loading words...</h1></div>';
    // Prevent further script execution until the page reloads with the config.
    throw new Error("Bootstrapping config...");
  }
  const savedSettings = (() => {
    try {
      const raw = localStorage.getItem("wordGamesSettings");
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      console.warn("Could not parse saved settings for falling words.", error);
      return null;
    }
  })();

  const fallingSettings = savedSettings?.games?.falling || {};
  const legacyWordLength = Number.isInteger(fallingSettings.wordLength) ? fallingSettings.wordLength : null;
  const maxWordLengthSetting = Number.isInteger(fallingSettings.maxWordLength) ? fallingSettings.maxWordLength : (legacyWordLength ?? 6);
  const baseLives = Math.max(1, Math.min(Number(fallingSettings.lives) || 3, 9));
  // Default settings biased for younger users: slower speed, lower density
  let baseSpeedSetting = 1;
  // gentler gravity for younger users
  let baseGravity = 0.18 + baseSpeedSetting * 0.08;
  let baseSpawnInterval = Math.max(68 - baseSpeedSetting * 3, 48);
  let wordDensity = 2;

  // Apply any saved falling settings (backwards-compatible keys)
  if (fallingSettings && typeof fallingSettings === 'object') {
    if (Number.isFinite(Number(fallingSettings.speed))) baseSpeedSetting = Number(fallingSettings.speed);
    if (Number.isFinite(Number(fallingSettings.density))) wordDensity = Number(fallingSettings.density);
    // recompute derived values (use gentler gravity)
    baseGravity = 0.18 + baseSpeedSetting * 0.08;
    baseSpawnInterval = Math.max(68 - baseSpeedSetting * 3, 48);
  }

  // Fall speed slider logic
  const fallSpeedSlider = document.getElementById('fallSpeedSlider');
  if (fallSpeedSlider) {
    // initialize slider to current setting
    fallSpeedSlider.value = String(baseSpeedSetting);
    const fallSpeedValueEl = document.getElementById('fallSpeedValue');
    if (fallSpeedValueEl) fallSpeedValueEl.textContent = String(baseSpeedSetting);
    fallSpeedSlider.addEventListener('input', () => {
      baseSpeedSetting = Number(fallSpeedSlider.value);
      if (fallSpeedValueEl) fallSpeedValueEl.textContent = String(baseSpeedSetting);
      // recompute derived values (gentler gravity)
      baseGravity = 0.18 + baseSpeedSetting * 0.08;
      baseSpawnInterval = Math.max(58 - baseSpeedSetting * 3, 40);
      saveFallingSettings();
    });
  }

  // Word density slider logic
  const wordDensitySlider = document.getElementById('wordDensitySlider');
  if (wordDensitySlider) {
    // initialize slider to current setting
    wordDensitySlider.value = String(wordDensity);
    const wordDensityValueEl = document.getElementById('wordDensityValue');
    if (wordDensityValueEl) wordDensityValueEl.textContent = String(wordDensity);
    wordDensitySlider.addEventListener('input', () => {
      wordDensity = Number(wordDensitySlider.value);
      if (wordDensityValueEl) wordDensityValueEl.textContent = String(wordDensity);
      saveFallingSettings();
    });
  }

  // Reset defaults button
  const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');
  if (resetDefaultsBtn) {
    resetDefaultsBtn.addEventListener('click', () => {
  baseSpeedSetting = 1;
  wordDensity = 2;
  baseGravity = 0.18 + baseSpeedSetting * 0.08;
  baseSpawnInterval = Math.max(68 - baseSpeedSetting * 3, 48);
      if (fallSpeedSlider) {
        fallSpeedSlider.value = String(baseSpeedSetting);
        const el = document.getElementById('fallSpeedValue');
        if (el) el.textContent = String(baseSpeedSetting);
      }
      if (wordDensitySlider) {
        wordDensitySlider.value = String(wordDensity);
        const el = document.getElementById('wordDensityValue');
        if (el) el.textContent = String(wordDensity);
      }
      saveFallingSettings();
    });
  }
  const maxWordLength = Math.max(3, Math.min(maxWordLengthSetting, 12));

  let vocab = Array.from(new Set(cfg.words.map(normalizeWord))).filter(Boolean);
  const filtered = vocab.filter(word => word.length <= maxWordLength);
  if (filtered.length) {
    vocab = filtered;
  }

  const field = document.getElementById("playfield");
  const virtualKeyboard = document.getElementById("virtualKeyboard");
  let currentTargetId = null; // id of the active urgent word
  // track progress per active entry: active map will hold {word, el, y, speed, progress}
  const livesEl = document.getElementById("lives");
  const scoreEl = document.getElementById("score");
  const speedEl = document.getElementById("speed");

  // Save/load helper for falling settings
  function saveFallingSettings() {
    try {
      const raw = localStorage.getItem('wordGamesSettings');
      const root = raw ? JSON.parse(raw) : {};
      root.games = root.games || {};
      root.games.falling = root.games.falling || {};
      root.games.falling.speed = baseSpeedSetting;
      root.games.falling.density = wordDensity;
      localStorage.setItem('wordGamesSettings', JSON.stringify(root));
    } catch (err) {
      console.warn('Could not save falling settings', err);
    }
  }

  let lives = baseLives;
  let score = 0;
  let tick = 0;
  let speedMultiplier = 1;
  let nextId = 1;
  let running = true;
  const active = new Map();

  livesEl.textContent = String(lives);
  speedEl.textContent = formatSpeed(speedMultiplier);

  function formatSpeed(value) {
    return Number.isInteger(value) ? `${value}x` : `${value.toFixed(1)}x`;
  }

  function spawn() {
    // Do not spawn more than maxActive words based on density
    const maxActive = Math.max(2, Math.floor(wordDensity * 1.5));
    if (active.size >= maxActive) return;

    const word = vocab[Math.floor(Math.random() * vocab.length)];
    if (!word) {
      return;
    }
  const element = document.createElement("div");
  element.className = "falling-word";
  // render each letter in a span so we can highlight the current letter
  element.innerHTML = Array.from(word).map(ch => `<span class="fw-letter">${ch}</span>`).join("");
    const x = Math.max(8, Math.floor(Math.random() * Math.max(field.clientWidth - 80, 40)));
    element.style.left = `${x}px`;
    element.style.top = "-30px";
    const id = nextId++;
    element.dataset.id = String(id);
    field.appendChild(element);
  // gentler velocity: lower contribution from speedMultiplier and less jitter
    const velocity = baseGravity + (speedMultiplier - 1) * 0.12 + Math.random() * 0.06;
    active.set(id, { word, el: element, y: -30, speed: velocity, progress: 0 });
    // Update urgent key highlight when new word spawns
    updateUrgentKey();
  }

  function loop() {
    if (!running) {
      return;
    }
    tick++;
    // spawnRate increases (less frequent) when density is lower
    const densityOffset = Math.floor((5 - wordDensity) * 6); // density 5 -> 0, density 1 -> +24
    const spawnRate = Math.max(baseSpawnInterval - Math.floor((speedMultiplier - 1) * 8) - Math.floor(score / 4) + densityOffset, 22);
    if (tick % spawnRate === 0) {
      spawn();
    }
    for (const [id, obj] of Array.from(active.entries())) {
      obj.y += obj.speed;
      obj.el.style.top = `${obj.y}px`;
      if (obj.y > field.clientHeight - 10) {
        field.removeChild(obj.el);
        active.delete(id);
        lives--;
        livesEl.textContent = String(lives);
        if (lives <= 0) {
          gameOver();
          return;
        }
      }
    }
    // update urgent key each frame (keeps highlight accurate)
    updateUrgentKey();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    const overlay = document.createElement("div");
    overlay.style.position = "absolute";
    overlay.style.inset = "0";
    overlay.style.display = "grid";
    overlay.style.placeItems = "center";
    overlay.style.background = "rgba(0,0,0,.08)";
    overlay.innerHTML = "<div class=\"card\"><div class=\"card-body\"><h2>Game over</h2><p>Score: " + score + "</p><a href=\"falling.html\"><button class=\"primary\">Play again</button></a></div></div>";
    field.appendChild(overlay);
  }

  function handleSubmit() {
    const value = normalizeWord(currentTyped);
    if (!value) {
      return;
    }
    let targetId = null;
    let bestY = -Infinity;
    for (const [id, obj] of active) {
      if (obj.word === value && obj.y > bestY) {
        targetId = id;
        bestY = obj.y;
      }
    }
    if (targetId !== null) {
      const match = active.get(targetId);
      match.el.remove();
      active.delete(targetId);
      score++;
      scoreEl.textContent = String(score);
      if (score > 0 && score % 6 === 0) {
        // ramp up speed more slowly to keep the game approachable
        speedMultiplier = Math.min(speedMultiplier + 0.12, 1 + baseSpeedSetting * 0.35);
        speedEl.textContent = formatSpeed(speedMultiplier);
      }
      currentTyped = "";
      updateTypedDisplay();
    } else {
      currentTyped = "";
      updateTypedDisplay();
    }
  }

  // Highlight the most crucial key: first letter of the lowest falling word
  function updateUrgentKey() {
    try {
      // find the active word with largest y (closest to bottom)
      let urgent = null;
      for (const [id, obj] of active) {
        if (!urgent || obj.y > urgent.y) urgent = obj;
      }
      const urgentLetter = urgent && urgent.word ? urgent.word[ urgent.progress || 0 ].toUpperCase() : null;
      // set current target id
      currentTargetId = urgent ? Number([...active].find(([k,v]) => v === urgent)[0]) : null;
      // clear previous highlights
      document.querySelectorAll('.key.key-urgent').forEach(k => k.classList.remove('key-urgent'));
      if (!urgentLetter) return;
      // Find matching key button and highlight
      const keys = Array.from(document.querySelectorAll('.virtual-keyboard .key'));
      for (const k of keys) {
        if (k.textContent.trim().toUpperCase() === urgentLetter) {
          k.classList.add('key-urgent');
          break;
        }
      }
      // mark active falling word visually and highlight current letter
      document.querySelectorAll('.falling-word.fw-active').forEach(el => el.classList.remove('fw-active'));
      if (urgent && urgent.el) urgent.el.classList.add('fw-active');
      // clear current letter markers
      document.querySelectorAll('.falling-word .fw-current').forEach(el => el.classList.remove('fw-current'));
      if (urgent && urgent.el) {
        const idx = urgent.progress || 0;
        const span = urgent.el.querySelectorAll('.fw-letter')[idx];
        if (span) span.classList.add('fw-current');
      }
    } catch (err) {
      // ignore
    }
  }

  // Typing handlers (physical keyboard & virtual keyboard) — per-letter mode
  function consumeTypedLetter(ch) {
    // ch should be uppercase A-Z or space
    if (!running) return;
    if (!currentTargetId) return; // nothing to type
    const entry = active.get(currentTargetId);
    if (!entry) return;
    const expected = (entry.word || '')[entry.progress || 0];
    if (!expected) return;
    if (ch === expected.toUpperCase()) {
      // correct — advance
      entry.progress = (entry.progress || 0) + 1;
      // update visuals
      updateUrgentKey();
      // completed word
      if (entry.progress >= entry.word.length) {
        entry.el.remove();
        active.delete(currentTargetId);
        currentTargetId = null;
        score++;
        scoreEl.textContent = String(score);
      }
    } else {
      // incorrect key — simple feedback: flash current letter
      if (entry.el) {
        const span = entry.el.querySelectorAll('.fw-letter')[entry.progress || 0];
        if (span) {
          span.classList.add('fw-wrong');
          setTimeout(() => span.classList.remove('fw-wrong'), 300);
        }
      }
    }
  }

  // physical keyboard
  function typingKeyHandler(e) {
    if (!running) return;
    if (e.key === 'Enter' || e.key === '\n') { e.preventDefault(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); return; }
    if (e.key.length === 1) {
      const ch = e.key.toUpperCase();
      if (ch.match(/[A-Z ]/)) {
        consumeTypedLetter(ch === ' ' ? ' ' : ch);
        e.preventDefault();
      }
    }
  }

  // virtual keyboard clicks
  if (virtualKeyboard) {
    virtualKeyboard.addEventListener('click', (ev) => {
      const target = ev.target;
      if (!target || !target.classList.contains('key')) return;
      const text = target.textContent.trim().toUpperCase();
      // Only single A-Z keys are used in per-letter mode now
      if (text.length === 1 && text.match(/^[A-Z]$/)) {
        consumeTypedLetter(text);
      }
    });
  }

  function fit() {
    field.style.height = "420px"; //nice
  }

  fit();

  // Start overlay logic
  const startOverlay = document.getElementById("startOverlay");
  function startGame() {
    if (startOverlay) startOverlay.style.display = "none";
    running = true;
    loop();
    // Focus the input box when game starts
    const startFocus = document.getElementById('playfieldHeader') || document.getElementById('playfield');
    if (startFocus) startFocus.focus && startFocus.focus();
    // attach typing handler for physical keyboard
    window.addEventListener('keydown', typingKeyHandler);
    window.removeEventListener("keydown", startGameListener);
    window.removeEventListener("mousedown", startGameListener);
    window.removeEventListener("touchstart", startGameListener);
  }
  function startGameListener(e) {
    // Prevent game start if event is from drawer or its controls
    const drawer = document.getElementById('settingsDrawer');
    if (drawer && drawer.contains(e?.target)) return;
    startGame();
  }
  running = false;
  // Always attach listeners for starting the game
  window.addEventListener("keydown", startGameListener);
  window.addEventListener("mousedown", startGameListener);
  window.addEventListener("touchstart", startGameListener);

  // Pause button logic
  const pauseBtn = document.getElementById("pauseBtn");
  if (pauseBtn) {
    pauseBtn.addEventListener("click", () => {
      running = !running;
      pauseBtn.textContent = running ? "⏸️ Pause" : "▶️ Resume";
      if (running) loop();
    });
  }
</script>
</body>
</html>
